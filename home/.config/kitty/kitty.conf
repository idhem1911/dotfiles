# Display Settings
background_opacity 0.75
enable_graphics_optimizations yes
window_title_format "{title}"

# Tab Bar Configuration
tab_bar_style powerline
tab_title_format "{index}: {title}"

# Font Settings - Upgraded to JetBrainsMono
font_family      JetBrainsMono Nerd Font
font_size        9.5
bold_font        auto
italic_font      auto
bold_italic_font auto
enable_ligatures true

# Keyboard Shortcuts
map f12 edit_config_file

# Theme Settings
# BEGIN_KITTY_THEME
# Adwaita darker
include current-theme.conf
# END_KITTY_THEME
shell zsh

confirm_os_window_close 0
