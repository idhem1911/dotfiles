# ==========================================================
#  ENVIRONMENT VARIABLES
# ==========================================================

env = ELECTRON_OZONE_PLATFORM_HINT,wayland
env = QT_QPA_PLATFORM,wayland
env = XCURSOR_SIZE,11
env = XCURSOR_THEME,Adwaita
env = GDK_SCALE,1
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
# env = GDK_DPI_SCALE,0.75
# env = QT_SCALE_FACTOR,0.75

# ==========================================================
#  MONITOR
# ==========================================================
# monitor=DP-2,1920x1080@180,0x0,1.0,bitdepth,1.10

monitor=DP-2,1920x1080@180,0x0,1

# ==========================================================
#  PROGRAMS & STARTUP
# ==========================================================

 $mainMod = SUPER
 $terminal = kitty
 $fileManager = thunar

 # Get Rofi Themes : https://github.com/adi1090x/rofi
 $menu = rofi -show drun -show-icons 

exec-once = systemctl --user start hyprpolkitagent
exec-once = waybar
exec-once = mako
exec-once = nm-applet --indicator
exec-once = corectrl
exec-once = wlsunset -t 2000 -T 4500
exec-once = hypridle
exec-once = hyprlock --daemonize
exec-once = awww-daemon
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = gnome-keyring-daemon --start --components=secrets
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = gnome-keyring-daemon --start --components=secrets

# ==========================================================
#  INPUT
# ==========================================================

input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0.0
    accel_profile = flat
    force_no_accel = true
    numlock_by_default = true
}

# ==========================================================
#  XWAYLAND & RENDERING
# ==========================================================

xwayland {
    force_zero_scaling = true
}

misc {
    vrr = 2  # 2 means VRR only activates for fullscreen games, keeping your desktop at 180Hz at all times
}

# ==========================================================
#  Edit the space between windows:
# ==========================================================

general {
    gaps_in = 2
    gaps_out = 3
    border_size = 1
}

# ==========================================================
#  Edge Color & Border Configuration Link https://www.fffuel.co/cccolor/
# ==========================================================

general {
    col.active_border = rgba(00FFA2A5) rgba(00FFA23F) 45deg # 03034a8c
    col.inactive_border = rgba(1a1b26ff)
}

# ==========================================================
#  DECORATIONS & BLUR
# ==========================================================

decoration {
    rounding = 5

    blur {
        enabled = true
        size = 7
        passes = 3
    }

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }
}

windowrule = opacity 0.8 0.8, match:class ^(.*)$

# ==========================================================
#  LAYERRULES
# ==========================================================

layerrule = match:namespace ^(waybar)$, blur on
layerrule = match:namespace ^(waybar)$, ignore_alpha 0
layerrule = match:namespace ^(rofi)$, blur on
layerrule = match:namespace ^(rofi)$, ignore_alpha 0
layerrule = match:namespace ^(swaync)$, blur on
layerrule = match:namespace ^(swaync)$, ignore_alpha 0

# ==========================================================
#  KEYBINDINGS: Core
# ==========================================================



bind = $mainMod, Q, killactive
bind = ALT, escape, killactive, 
bind = $mainMod, T, exec, $terminal
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, SPACE, togglefloating,
bind = ALT, F2, exec, $menu
bind = $mainMod, M, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit

bind = ALT, V, exec, cliphist list | rofi -dmenu | cliphist decode | wl-copy
bind = ALT, W, exec, brave --ozone-platform=wayland --disable-background-networking --disable-features=TranslateUI --no-first-run --no-default-browser-check --force-webrtc-ip-handling-policy=default_public_interface_only --enable-features=VaapiVideoDecoder,Vulkan
bind = ALT, N, exec, zeditor
bind = ALT, O, exec, obsidian --enable-features=UseOzonePlatform --ozone-platform=wayland
bind = ALT, T, exec, env QT_QPA_PLATFORM=wayland env QT_SCALE_FACTOR=1 Telegram
bind = ALT, P, exec, waypaper

bind = $mainMod, Print, exec, grimblast copy window
bind = ALT, Print, exec, grimblast copy area
bind = CTRL, Print, exec, grimblast save screen
bind = CTRL ALT, P, exec, killall -SIGUSR2 waybar

# ==========================================================
#  KEYBINDINGS: Focus & Movement
# ==========================================================

bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

bind = $mainMod CTRL, left, resizeactive, -30 0
bind = $mainMod CTRL, right, resizeactive, 30 0
bind = $mainMod CTRL, up, resizeactive, 0 -30
bind = $mainMod CTRL, down, resizeactive, 0 30

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bind = $mainMod ALT, left, swapwindow, l
bind = $mainMod ALT, right, swapwindow, r
bind = $mainMod ALT, up, swapwindow, u
bind = $mainMod ALT, down, swapwindow, d

# ==========================================================
#  KEYBINDINGS: Power & Session
# ==========================================================
bind = CTRL ALT, Page_Down, exec, systemctl suspend --check-inhibitors=no
bind = CTRL ALT, Page_Up, exec, systemctl reboot
bind = CTRL ALT, End, exec, systemctl poweroff
bind = CTRL ALT, Delete, exec, hyprctl dispatch exit

# ==========================================================
#  KEYBINDINGS: Audio & Lock
# ==========================================================

bind = $mainMod, L, exec, hyprlock

bind = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bind = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , Pause, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

bind = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bind = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# ==========================================================
#  KEYBINDINGS: Workspaces
# ==========================================================

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5

bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

bind = CTRL ALT, 0, exec, zsh ~/.config/hypr/scripts/change_wall.sh 0
bind = CTRL ALT, 1, exec, zsh ~/.config/hypr/scripts/change_wall.sh 1
bind = CTRL ALT, 2, exec, zsh ~/.config/hypr/scripts/change_wall.sh 2
bind = CTRL ALT, 3, exec, zsh ~/.config/hypr/scripts/change_wall.sh 3
bind = CTRL ALT, 4, exec, zsh ~/.config/hypr/scripts/change_wall.sh 4
bind = CTRL ALT, 5, exec, zsh ~/.config/hypr/scripts/change_wall.sh 5
bind = CTRL ALT, 6, exec, zsh ~/.config/hypr/scripts/change_wall.sh 6
bind = CTRL ALT, 7, exec, zsh ~/.config/hypr/scripts/change_wall.sh 7
bind = CTRL ALT, 8, exec, zsh ~/.config/hypr/scripts/change_wall.sh 8
bind = CTRL ALT, 9, exec, zsh ~/.config/hypr/scripts/change_wall.sh 9

# ==========================================================
#  Floating Apps
# ==========================================================

# To Find Your App's Class Name run:  hyprctl clients

# size 925 495
windowrule = match:class ^(kitty)$, float on
windowrule = match:class ^(kitty)$, size 415 295 
windowrule = match:class ^(kitty)$, center on

windowrule = match:class ^(thunar)$, float on
windowrule = match:class ^(thunar))$, size 625 495
windowrule = match:class ^(thunar))$, center on

windowrule = match:class ^(org.telegram.desktop)$, float on
windowrule = match:class ^(org.telegram.desktop)$, size 310 450
windowrule = match:class ^(org.telegram.desktop)$, center on
