# --- General Performance ---
vo=gpu-next
gpu-api=vulkan
hwdec=auto-safe

# --- High-Quality Scaling ---
profile=high-quality
scale=ewa_lanczossharp
dscale=mitchell
cscale=spline36

# --- Shaders (Use Medium for 1080p. Ultra is melting your GPU) ---
# glsl-shaders="~~/shaders/Anime4K_Restore_CNN_M.glsl"

# Best balanced restoration for 1080p on 180Hz
glsl-shaders="~~/shaders/Anime4K_Restore_CNN_UL.glsl"

# --- Motion & Smoothness ---
video-sync=display-resample
# interpolation=yes   <-- DISABLED. Kills GPU on 24fps anime and causes mouse lag.
# tscale=oversample   <-- DISABLED.

# --- Cleanup ---
deband=yes
deband-iterations=2   # 4 is too high. 2 removes banding without tanking performance.
