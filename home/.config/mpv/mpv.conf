# Best balanced restoration for 1080p on 180Hz
glsl-shaders="~~/shaders/Anime4K_Restore_CNN_UL.glsl"

# Simple sharpening (0.0 to 1.0)
# sharpen=0.85

# --- General Performance ---
vo=gpu-next                 # Uses the modern libplacebo renderer (better for AMD)
gpu-api=vulkan              # Vulkan usually beats OpenGL on modern AMD cards
hwdec=auto-safe             # Enables hardware decoding safely

# --- High-Quality Scaling ---
profile=high-quality        # Loads the built-in HQ profile as a base
scale=ewa_lanczossharp      # The "Gold Standard" for upscaling: sharp but clean
dscale=mitchell             # High-quality downscaler to avoid artifacts
cscale=spline36             # Excellent color (chroma) scaling

# --- Motion & Smoothness (180Hz Fix) ---
video-sync=display-resample # Syncs video frames to your 180Hz display
interpolation=yes           # Reduces "judder" on high refresh rate monitors
tscale=oversample           # Smoothest interpolation method for 180Hz

# --- Anime Specific Cleanup ---
deband=yes                  # Removes "banding" (color lines) in flat backgrounds
deband-iterations=4         # Stronger debanding for anime
